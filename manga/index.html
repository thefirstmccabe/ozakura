<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>Ōzakura Volume 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: full-bleed ink-dark stage, pages centered; a slim control strip slides in at the bottom. Single deliberate dark look. */
:root {
  --ink: #0f0d12;        /* stage */
  --paper: #f3eff0;      /* text on stage */
  --dim: #8e8790;        /* secondary text */
  --bar: rgba(20, 17, 24, .94);
  --line: #2c2730;
  --sakura: #e9a6b8;     /* accent: blossom pink */
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--ink); color: var(--paper); font-family: var(--font-ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; touch-action: manipulation; -webkit-user-select: none; -webkit-touch-callout: none; user-select: none; }
#stage.scroll { overflow-y: auto; align-items: flex-start; display: block; }
.spread { display: flex; flex-direction: row-reverse; justify-content: center; align-items: center; height: 100%; width: 100%; gap: 0; padding-block: 12px; box-sizing: border-box; }
.spread img { height: 100%; width: auto; max-width: 50%; object-fit: contain; display: block; background: #fff; }
.spread.one img { max-width: 100%; }
#stage.scroll .spread { height: auto; flex-direction: column; padding: 0; }
#stage.scroll .spread img { width: 100%; max-width: 900px; height: auto; margin-inline: auto; }
.spread img + img { box-shadow: inset -12px 0 18px -14px rgba(0,0,0,.45); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bar); border-top: 1px solid var(--line); display: grid; gap: 10px; transition: transform .22s ease, opacity .22s ease; z-index: 5; }
#bar.off { transform: translateY(110%); opacity: 0; pointer-events: none; }
#top { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--bar); border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; transition: transform .22s ease, opacity .22s ease; z-index: 5; }
#top.off { transform: translateY(-110%); opacity: 0; pointer-events: none; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .02em; }
.logo small { font-weight: 600; font-size: 14px; color: var(--dim); margin-left: 8px; letter-spacing: .12em; text-transform: uppercase; }
.where { margin-left: auto; color: var(--dim); font-size: 13px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.main { flex-wrap: nowrap; }
#slider { flex: 1; min-width: 0; direction: rtl; accent-color: var(--sakura); }
.count { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--dim); min-width: 64px; text-align: center; }
button { font: inherit; font-size: 13px; color: var(--paper); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button:focus-visible, #slider:focus-visible { outline: 2px solid var(--sakura); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--sakura); color: var(--ink); border-color: var(--sakura); }
button.nav { font-size: 16px; padding: 4px 12px; }
a.pdf { font-size: 13px; color: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; text-decoration: none; }
.hint { font-size: 12px; color: var(--dim); }
.sep { flex: 1; }
#toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--bar); border: 1px solid var(--line); padding: 14px 18px; border-radius: 12px; font-size: 14px; text-align: center; max-width: min(320px, 80vw); line-height: 1.5; z-index: 6; transition: opacity .4s; }
#toast b { color: var(--sakura); font-weight: 700; }
#toast.gone { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { #bar, #top, #toast { transition: none; } }
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>

<header id="top">
  <div class="logo">大桜 Ōzakura <small>Vol. 1</small></div>
  <div class="where" id="where">Cover</div>
</header>

<nav id="bar" aria-label="Reader controls">
  <div class="row main">
    <button class="nav" id="next" aria-label="Next page">‹</button>
    <input id="slider" type="range" min="0" max="48" value="0" aria-label="Page">
    <button class="nav" id="prev" aria-label="Previous page">›</button>
    <span class="count" id="count">1 / 49</span>
  </div>
  <div class="row">
    <button data-jump="0">Cover</button>
    <button data-jump="1">Ch. 1</button>
    <button data-jump="25">Ch. 2</button>
    <span class="sep"></span>
    <button id="mode" aria-pressed="false">Two-page</button>
    <button id="fit" aria-pressed="false">Fit width</button>
    <a class="pdf" href="ozakura_vol1.pdf">PDF</a>
  </div>
</nav>

<div id="toast">Read <b>right to left</b>.<br>Tap the left side or swipe right to go forward. Tap the middle for controls.</div>

<script>
(function () {
  const N = 49;
  const src = i => 'p/' + String(i).padStart(2, '0') + '.jpg';
  const CH1 = 1, CH2 = 25;
  const titles = i => i === 0 ? 'Cover' : i < CH2 ? 'Chapter 1 · The House Next Door' : 'Chapter 2 · Kendo';
  const stage = document.getElementById('stage');
  const slider = document.getElementById('slider');
  const count = document.getElementById('count');
  const where = document.getElementById('where');
  const bar = document.getElementById('bar'), top = document.getElementById('top');
  const modeBtn = document.getElementById('mode'), fitBtn = document.getElementById('fit');
  const toast = document.getElementById('toast');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  let page = parseInt(store.get('oz.page') || '0', 10); if (!(page >= 0 && page < N)) page = 0;
  let spreadPref = store.get('oz.spread2');
  let fitWidth = false;
  // single page by default; two-page view is opt-in on wide screens
  const wide = () => window.innerWidth > window.innerHeight * 1.05 && window.innerWidth >= 820;
  const useSpread = () => !fitWidth && spreadPref === '1' && wide();

  // spread groups: cover alone, then (1,2), (3,4) ... (47,48); first of each pair sits on the right
  const group = i => useSpread() ? (i === 0 ? [0] : (i % 2 ? [i, i + 1] : [i - 1, i]).filter(x => x < N)) : [i];

  const cache = {};
  function preload(i) { if (i < 0 || i >= N || cache[i]) return; const im = new Image(); im.src = src(i); cache[i] = im; }

  function render() {
    const g = group(page);
    page = g[0];
    const wrap = document.createElement('div');
    wrap.className = 'spread' + (g.length === 1 ? ' one' : '');
    g.forEach(i => { const im = document.createElement('img'); im.src = src(i); im.alt = 'Page ' + (i + 1) + ' of ' + N; im.draggable = false; wrap.appendChild(im); });
    stage.replaceChildren(wrap);
    stage.classList.toggle('scroll', fitWidth);
    if (fitWidth) stage.scrollTop = 0;
    slider.value = page;
    count.textContent = (g.length > 1 ? (g[0] + 1) + '–' + (g[1] + 1) : (page + 1)) + ' / ' + N;
    where.textContent = titles(page);
    modeBtn.setAttribute('aria-pressed', useSpread() ? 'true' : 'false');
    fitBtn.setAttribute('aria-pressed', fitWidth ? 'true' : 'false');
    store.set('oz.page', String(page));
    const last = g[g.length - 1];
    for (let k = 1; k <= 3; k++) { preload(last + k); preload(g[0] - k); }
  }
  function go(d) {
    const g = group(page);
    const t = d > 0 ? g[g.length - 1] + 1 : g[0] - 1;
    if (t < 0 || t >= N) return;
    page = t; render();
  }
  function jump(i) { page = Math.max(0, Math.min(N - 1, i)); render(); }
  function setUI(on) { bar.classList.toggle('off', !on); top.classList.toggle('off', !on); }
  let uiOn = true;
  function hideHint() { toast.classList.add('gone'); }

  document.getElementById('next').onclick = () => go(1);
  document.getElementById('prev').onclick = () => go(-1);
  slider.oninput = () => jump(parseInt(slider.value, 10));
  document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => jump(parseInt(b.dataset.jump, 10)));
  modeBtn.onclick = () => { spreadPref = spreadPref === '1' ? '0' : '1'; store.set('oz.spread2', spreadPref); fitWidth = false; render(); };
  fitBtn.onclick = () => { fitWidth = !fitWidth; render(); };

  // tap zones: left third = forward (RTL), right third = back, middle toggles controls.
  // Touch uses touch events (reliable on iPad Safari); mouse uses pointer events.
  function handle(x, y, dx, dy, dt, moved) {
    hideHint();
    if (window.visualViewport && window.visualViewport.scale > 1.05) return;
    if (!fitWidth && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 700) { go(dx > 0 ? 1 : -1); return; }
    if (moved) return;
    const w = window.innerWidth;
    if (x < w / 3) go(1); else if (x > w * 2 / 3) go(-1); else { uiOn = !uiOn; setUI(uiOn); }
  }
  let sx = 0, sy = 0, st = 0, mv = false, multi = false;
  stage.addEventListener('touchstart', e => { multi = e.touches.length > 1; const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); mv = false; }, { passive: true });
  stage.addEventListener('touchmove', e => { if (e.touches.length > 1) multi = true; const t = e.touches[0]; if (Math.hypot(t.clientX - sx, t.clientY - sy) > 10) mv = true; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (multi || e.touches.length) return;
    const t = e.changedTouches[0];
    e.preventDefault();
    handle(t.clientX, t.clientY, t.clientX - sx, t.clientY - sy, Date.now() - st, mv);
  });
  let downX = null, downY = null, downT = 0, moved = false;
  stage.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; downX = e.clientX; downY = e.clientY; downT = Date.now(); moved = false; });
  stage.addEventListener('pointermove', e => { if (downX !== null && Math.hypot(e.clientX - downX, e.clientY - downY) > 10) moved = true; });
  stage.addEventListener('pointerup', e => {
    if (e.pointerType !== 'mouse' || downX === null) return;
    const dx = e.clientX - downX, dy = e.clientY - downY; downX = null;
    handle(e.clientX, e.clientY, dx, dy, Date.now() - downT, moved);
  });
  document.addEventListener('keydown', e => {
    if (e.target === slider) return;
    if (e.key === 'ArrowLeft' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(1); hideHint(); }
    else if (e.key === 'ArrowRight' || e.key === 'PageUp' || e.key === 'Backspace') { e.preventDefault(); go(-1); hideHint(); }
    else if (e.key === 'Home') jump(0);
    else if (e.key === 'End') jump(N - 1);
  });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
  setTimeout(hideHint, 5000);
  setTimeout(() => { if (page > 0) { uiOn = false; setUI(false); } }, 2500);
  render();
})();
</script>
</body>
</html>
