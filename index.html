<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ōzakura">
<meta name="theme-color" content="#10131f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Ōzakura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one full-viewport stage — background cover-fit, sprites bottom-anchored, dialogue panel docked low. Single dark "night ink" world by design. */
:root{
  --ink:#10131f;          /* stage + panels */
  --ink-2:#1b2034;        /* raised panel */
  --paper:#f3ecdf;        /* body text, washi white */
  --paper-dim:#bdb6a8;    /* secondary text */
  --sakura:#e8a7b5;       /* accent: blossom pink */
  --gilt:#c9a46a;         /* hairlines, chapter ornaments */
  --veil:rgba(12,14,24,.82);
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#app{position:fixed;inset:0;overflow:hidden;font-family:var(--f-body);touch-action:manipulation}
.layer{position:absolute;inset:0}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
.bgimg.on{opacity:1}
#bgSolid{background:#000;transition:background .6s}
#sprites{pointer-events:none}
.spr{position:absolute;bottom:0;transform:translateX(-50%);transition:opacity .35s ease,filter .3s ease,left .45s ease;opacity:0;will-change:opacity}
.spr.on{opacity:1}
.spr.dim{filter:brightness(.78) saturate(.9)}
#cg .bgimg{transition:opacity 1s ease}
#tint{pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(20,10,30,.45) 100%)}
#tint.on{opacity:1}
#flash{pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-2px)}30%,50%,70%{transform:translate(-9px,3px)}40%,60%{transform:translate(9px,-3px)}}

/* dialogue panel */
#box{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));
  width:min(1180px,calc(100% - 32px));min-height:clamp(104px,19vh,176px);box-sizing:border-box;
  background:linear-gradient(180deg,rgba(16,19,31,.80),rgba(16,19,31,.92));
  border-top:1px solid rgba(201,164,106,.55);border-radius:4px;
  box-shadow:0 10px 40px rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:clamp(20px,2.8vh,30px) clamp(18px,3vw,40px) clamp(38px,5vh,46px);transition:opacity .25s}
#box.hidden{opacity:0;pointer-events:none}
#name{position:absolute;top:0;left:clamp(14px,2.4vw,34px);transform:translateY(-62%);
  font-family:var(--f-display);font-weight:700;font-size:clamp(16px,2.4vh,23px);letter-spacing:.06em;
  padding:.28em 1.05em .32em;background:var(--ink-2);border:1px solid rgba(201,164,106,.5);border-radius:3px;
  color:var(--paper);min-width:4em;text-align:center}
#name:empty{display:none}
#name .bar{display:block;height:2px;margin-top:4px;border-radius:2px;background:var(--nc,var(--sakura))}
#text{font-size:clamp(17px,2.55vh,27px);line-height:1.62;max-width:62em;min-height:3.2em;white-space:pre-wrap;
  text-wrap:pretty;color:var(--paper)}
#text.narr{color:#ebe3d4}
#text.interlude{font-style:normal;color:#e9dccb}
#text .cur{display:inline-block;width:.5em;color:var(--sakura);animation:blink 1.1s infinite;margin-left:.15em}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:0}}
#ilabel{position:absolute;top:max(16px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  font-family:var(--f-display);letter-spacing:.3em;font-size:clamp(12px,1.7vh,16px);color:var(--paper);
  padding:.45em 1.4em;background:rgba(16,19,31,.7);border:1px solid rgba(201,164,106,.4);border-radius:2px;
  opacity:0;transition:opacity .6s;pointer-events:none}
#ilabel.on{opacity:1}
#ctrl{position:absolute;right:clamp(12px,2vw,26px);bottom:clamp(8px,1.2vh,12px);display:flex;gap:2px}
.cb{appearance:none;border:0;background:transparent;color:var(--paper-dim);font:500 clamp(11px,1.45vh,14px)/1 var(--f-body);
  letter-spacing:.12em;text-transform:uppercase;padding:.75em .8em;border-radius:3px;cursor:pointer}
.cb:hover,.cb:focus-visible{color:var(--paper);background:rgba(255,255,255,.07);outline:none}
.cb.on{color:var(--sakura)}

/* phone */
#phone{position:absolute;right:clamp(16px,6vw,90px);top:clamp(16px,5vh,60px);width:min(360px,calc(100% - 32px));
  max-height:58vh;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:16px 14px;
  background:rgba(240,236,228,.95);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.5);
  opacity:0;transform:translateY(12px);transition:opacity .35s,transform .35s;pointer-events:none;color:#1b1d26}
#phone.on{opacity:1;transform:none}
#phone .ph{font:700 13px/1 var(--f-body);color:#5b5f70;text-align:center;padding-bottom:6px;border-bottom:1px solid rgba(0,0,0,.08);letter-spacing:.04em}
.msg{max-width:82%;padding:8px 12px;border-radius:16px;font-size:clamp(14px,1.9vh,17px);line-height:1.4;animation:pop .25s ease-out}
.msg.me{align-self:flex-end;background:#e98fa4;color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}
@keyframes pop{from{transform:scale(.9);opacity:0}}

/* full-screen cards */
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--ink);opacity:0;pointer-events:none;transition:opacity .8s;text-align:center;padding:0 24px}
.card.on{opacity:1;pointer-events:auto}
.ch-num{font-family:var(--f-display);color:var(--gilt);letter-spacing:.5em;font-size:clamp(13px,2vh,18px)}
.ch-title{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vh,70px);letter-spacing:.04em;text-wrap:balance}
.ch-rule{width:72px;height:1px;background:var(--gilt);opacity:.7}
.ch-kanji{font-family:var(--f-display);color:var(--paper-dim);font-size:clamp(14px,2.2vh,20px);letter-spacing:.4em}
#dateCard{background:transparent}
#dateCard .d{font-family:var(--f-display);font-size:clamp(22px,4.2vh,40px);letter-spacing:.12em;padding:.5em 1.6em;
  background:rgba(16,19,31,.72);border-top:1px solid var(--gilt);border-bottom:1px solid var(--gilt)}

/* title */
#title{position:absolute;inset:0;z-index:20;background:var(--ink)}
#title img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#title .shade{position:absolute;inset:0;background:linear-gradient(100deg,rgba(14,16,26,.86) 0%,rgba(14,16,26,.55) 34%,rgba(14,16,26,0) 62%)}
#title .brand{position:absolute;left:clamp(24px,7vw,110px);top:50%;transform:translateY(-52%);display:flex;gap:clamp(16px,2.4vw,34px);align-items:flex-start}
.tate{writing-mode:vertical-rl;font-family:var(--f-display);font-weight:800;font-size:clamp(46px,11vh,110px);letter-spacing:.12em;
  color:var(--paper);text-shadow:0 2px 24px rgba(0,0,0,.5);line-height:1}
.brand .stack{display:flex;flex-direction:column;gap:clamp(14px,2.6vh,26px);padding-top:.4em}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vh,58px);letter-spacing:.08em;line-height:1}
.brand .sub{font-size:clamp(12px,1.7vh,15px);color:var(--paper-dim);letter-spacing:.22em;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.mi{appearance:none;border:0;background:transparent;color:var(--paper);text-align:left;cursor:pointer;
  font:500 clamp(16px,2.5vh,22px)/1.2 var(--f-display);letter-spacing:.14em;padding:.5em 0 .5em .9em;border-left:2px solid transparent;transition:border-color .2s,color .2s,padding .2s}
.mi:hover,.mi:focus-visible{border-left-color:var(--sakura);color:#fff;padding-left:1.2em;outline:none}
.mi[disabled]{opacity:.35;cursor:default}
#tapStart{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9vh;z-index:21;
  font-family:var(--f-display);letter-spacing:.4em;font-size:clamp(14px,2.2vh,19px);color:var(--paper);
  background:rgba(10,12,20,.25);cursor:pointer}
#tapStart span{animation:breathe 2.4s ease-in-out infinite;padding:.6em 1.4em;background:rgba(16,19,31,.55);border-radius:2px}
@keyframes breathe{50%{opacity:.45}}

/* panels: log, save, settings, chapters */
.panel{position:absolute;inset:0;z-index:30;background:rgba(10,12,20,.92);display:none;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top,0px)) 16px max(18px,env(safe-area-inset-bottom,0px))}
.panel.on{display:flex}
.panel header{display:flex;align-items:center;justify-content:space-between;width:min(980px,100%);margin:0 auto 12px;gap:12px}
.panel h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3.2vh,30px);letter-spacing:.14em}
.panel .body{flex:1;overflow-y:auto;width:min(980px,100%);margin:0 auto;-webkit-overflow-scrolling:touch;min-height:0}
.x{appearance:none;border:1px solid rgba(201,164,106,.5);background:transparent;color:var(--paper);border-radius:3px;
  font:500 14px var(--f-body);letter-spacing:.12em;padding:.6em 1.1em;cursor:pointer}
.x:hover,.x:focus-visible{background:rgba(255,255,255,.06);outline:none}
.log-row{display:grid;grid-template-columns:7.5em 1fr 2.4em;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.07);align-items:start}
.log-row .who{font-family:var(--f-display);font-weight:700;color:var(--sakura);text-align:right;padding-top:.15em}
.log-row .t{line-height:1.6;min-width:0}
.log-row .ja{font-family:var(--f-display);font-size:.88em;color:var(--paper-dim);margin-top:.2em;letter-spacing:.04em}
.log-row .vb{appearance:none;border:0;background:transparent;color:var(--gilt);font-size:17px;cursor:pointer;padding:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.slot{appearance:none;text-align:left;border:1px solid rgba(255,255,255,.12);background:var(--ink-2);color:var(--paper);border-radius:4px;
  padding:0;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;font:inherit}
.slot:hover,.slot:focus-visible{border-color:var(--sakura);outline:none}
.slot .th{aspect-ratio:16/9;width:100%;background:#000 center/cover no-repeat;max-width:100%}
.slot .meta{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.slot .n{font:700 13px var(--f-body);letter-spacing:.16em;color:var(--gilt)}
.slot .s{font-size:14px;color:var(--paper-dim);line-height:1.4}
.set{display:grid;grid-template-columns:minmax(120px,14em) 1fr;gap:14px 20px;align-items:center;padding:8px 4px}
.set label{color:var(--paper-dim);letter-spacing:.06em}
.set input[type=range]{width:100%;accent-color:var(--sakura)}
.voices{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--paper);border-radius:999px;padding:.45em .95em;font:500 14px var(--f-body);cursor:pointer}
.chip.off{opacity:.4;text-decoration:line-through}
.chap{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.chap button{appearance:none;border:1px solid rgba(255,255,255,.12);background:var(--ink-2);color:var(--paper);border-radius:4px;padding:0;cursor:pointer;overflow:hidden;text-align:left;font:inherit}
.chap button:hover,.chap button:focus-visible{border-color:var(--sakura);outline:none}
.chap .th{aspect-ratio:16/9;background:#000 center/cover no-repeat}
.chap .meta{padding:10px 12px}
.chap .k{font-family:var(--f-display);color:var(--gilt);letter-spacing:.2em;font-size:13px}
.chap .tt{font-family:var(--f-display);font-weight:700;font-size:18px;margin-top:4px}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:40;background:var(--ink-2);border:1px solid var(--gilt);
  padding:.6em 1.2em;border-radius:3px;font-size:14px;letter-spacing:.08em;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
.sndout{white-space:pre-wrap;font:13px/1.55 ui-monospace,Menlo,monospace;color:var(--paper-dim);margin:.7em 0 0;min-height:0}
.sndout:empty{display:none}
#err{position:absolute;left:12px;bottom:12px;z-index:50;max-width:min(560px,calc(100% - 24px));background:#3a1820;color:var(--paper);
  border:1px solid var(--sakura);border-radius:3px;padding:.7em 1em;font-size:13px;line-height:1.45;cursor:pointer}
#endCard .thanks{color:var(--paper-dim);max-width:34em;line-height:1.7;font-size:clamp(14px,2vh,17px)}
#endCard .x{margin-top:18px}
/* developer mode: scene chart + line stepper (shown only when developer mode is on) */
#app:not(.dev) .dev-only{display:none!important}
input{-webkit-user-select:text;user-select:text}
.mi.devmi{text-shadow:0 1px 10px rgba(0,0,0,.65)}
.mi.devmi::after{content:"DEV";font:700 10px/1 var(--f-body);letter-spacing:.16em;color:#1b1d26;background:var(--gilt);padding:3px 5px;border-radius:2px;margin-left:.8em;vertical-align:.35em;text-shadow:none}
#chartP{background:var(--ink)}
#devbar{position:absolute;z-index:25;display:flex;align-items:center;gap:1px;padding:2px 3px 2px 4px;
  right:calc((100% - min(1180px,calc(100% - 32px)))/2 + clamp(14px,2.4vw,34px));
  bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + var(--boxh,150px) + 12px);
  background:rgba(27,32,52,.92);border:1px solid rgba(201,164,106,.5);border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#title:not([hidden]) ~ #devbar{display:none}
#devbar .did{appearance:none;border:0;background:transparent;color:var(--gilt);font:600 13px/1 ui-monospace,Menlo,monospace;letter-spacing:.03em;padding:10px 8px;cursor:pointer;border-radius:3px}
#devbar .dsc{color:var(--paper-dim);font:500 12px/1 var(--f-body);letter-spacing:.06em;padding:0 8px 0 2px;white-space:nowrap}
#devbar .db{appearance:none;border:0;background:transparent;color:var(--paper);width:40px;height:36px;border-radius:3px;display:grid;place-items:center;cursor:pointer;padding:0}
#devbar .db svg{width:15px;height:15px;fill:currentColor}
#devbar .did:hover,#devbar .db:hover,#devbar .did:focus-visible,#devbar .db:focus-visible{background:rgba(255,255,255,.08);outline:none}
#devbar .dchart{width:auto;padding:0 12px;font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--sakura);border-left:1px solid rgba(255,255,255,.1);border-radius:0 3px 3px 0}
#chartP header{flex-wrap:wrap}
.chart-h,.chart-r{display:flex;align-items:center;gap:12px;min-width:0}
.chart-r{flex:1;justify-content:flex-end}
#chartQ{flex:1;min-width:0;max-width:340px;appearance:none;-webkit-appearance:none;background:var(--ink-2);border:1px solid rgba(255,255,255,.16);border-radius:3px;color:var(--paper);font:400 16px var(--f-body);padding:.5em .8em}
#chartQ:focus{outline:none;border-color:var(--sakura)}
.cch{display:flex;align-items:baseline;gap:14px;margin:26px 2px 12px;padding-bottom:8px;border-bottom:1px solid rgba(201,164,106,.35)}
.cch:first-child{margin-top:4px}
.cch .k{font-family:var(--f-display);color:var(--gilt);letter-spacing:.3em;font-size:13px}
.cch .tt{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em}
.scg{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.sc{appearance:none;border:1px solid rgba(255,255,255,.12);background:var(--ink-2);color:var(--paper);border-radius:4px;padding:0;cursor:pointer;overflow:hidden;text-align:left;font:inherit;display:flex;flex-direction:column;position:relative}
.sc:hover,.sc:focus-visible{border-color:var(--sakura);outline:none}
.sc.now{border-color:var(--sakura);box-shadow:0 0 0 1px var(--sakura)}
.sc img,.sd-head img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.sc .meta{padding:9px 11px 12px;display:flex;flex-direction:column;gap:5px}
.sc .n,.sd-head .n{font:600 12px ui-monospace,Menlo,monospace;color:var(--gilt);letter-spacing:.05em}
.sc .tt{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.25}
.sc .s{font-size:12px;color:var(--paper-dim);line-height:1.4}
.sc .tag{position:absolute;top:8px;left:8px;background:var(--sakura);color:#1b1d26;font:700 10px/1 var(--f-body);letter-spacing:.16em;padding:4px 7px;border-radius:2px}
.wd{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--paper-dim)}
.wd i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.sd-head{display:flex;gap:18px;align-items:flex-start;margin:2px 0 16px;flex-wrap:wrap}
.sd-head img{width:min(280px,42%);border-radius:3px}
.sd-head .info{flex:1;min-width:230px;display:flex;flex-direction:column;gap:8px}
.sd-head .tt{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3vh,26px);letter-spacing:.03em}
.sd-head .s{font-size:13px;color:var(--paper-dim);line-height:1.5}
.sd-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.ln-row{display:grid;grid-template-columns:1fr 2.6em;align-items:start;border-bottom:1px solid rgba(255,255,255,.06)}
.ln-row.now{background:rgba(232,167,181,.11);box-shadow:inset 3px 0 0 var(--sakura)}
.ln{appearance:none;border:0;background:transparent;color:var(--paper);font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:5.4em 6.6em 1fr;gap:12px;padding:11px 6px;align-items:start;min-width:0}
.ln:hover,.ln:focus-visible{background:rgba(255,255,255,.05);outline:none}
.ln .lid{font:12px/1.95 ui-monospace,Menlo,monospace;color:var(--paper-dim)}
.ln .lw{font-family:var(--f-display);font-weight:700;color:var(--nc,var(--paper-dim));text-align:right;line-height:1.6}
.ln .lt{line-height:1.6;min-width:0}
.ln.nar .lt{color:#d6cebf}
.ln .ja{display:block;font-family:var(--f-display);font-size:.88em;color:var(--paper-dim);margin-top:.15em;letter-spacing:.03em}
.ln .scl{display:block;font-size:12px;color:var(--gilt);letter-spacing:.05em;margin-bottom:.2em}
.ln-row .vb{appearance:none;border:0;background:transparent;color:var(--gilt);font-size:17px;cursor:pointer;padding:11px 0;min-height:44px}
.mk{appearance:none;border:0;border-bottom:1px solid rgba(255,255,255,.06);background:transparent;width:100%;text-align:left;cursor:pointer;
  font:600 11px/1.4 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gilt);padding:10px 6px 10px calc(12em + 30px)}
.mk.minor{color:rgba(189,182,168,.6)}
.mk:hover,.mk:focus-visible{background:rgba(255,255,255,.05);outline:none}
.mk.now{background:rgba(232,167,181,.11)}
.chart-note{color:var(--paper-dim);font-size:13px;letter-spacing:.04em;margin:2px 4px 10px}
@media (max-width:700px){ .ln{grid-template-columns:1fr;gap:2px} .ln .lw{text-align:left} .mk{padding-left:6px} #devbar .dsc{display:none} }
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-aspect-ratio: 1/1){ #box{min-height:22vh} .spr{max-width:none} }
</style>
</head>
<body>


<div id="app" aria-label="Ōzakura visual novel">
  <div id="bgSolid" class="layer"></div>
  <div id="bg" class="layer"><img class="bgimg" alt=""><img class="bgimg" alt=""></div>
  <div id="sprites" class="layer"></div>
  <div id="cg" class="layer"><img class="bgimg" alt=""><img class="bgimg" alt=""></div>
  <div id="tint" class="layer"></div>

<script>
(()=>{
'use strict';
/* ---------- config ---------- */
const CHAR = { // height in inches, visible fraction of body in sprite, name colour
  kohei:{h:69,v:.57,c:'#7da4d6'}, nanoha:{h:60,v:.57,c:'#e8a7b5'}, natsuki:{h:63,v:.57,c:'#e8965a'},
  akane:{h:61,v:.62,c:'#a9a3c9'}, ryosuke:{h:68,v:.57,c:'#8fb8a8'}, rika:{h:62,v:.57,c:'#f0c95a'},
  yuzu:{h:61,v:.57,c:'#e07c7c'}, kirishima:{h:66,v:.57,c:'#b7c3d6'}, takatsuki:{h:70,v:.57,c:'#8a96c9'},
  sota:{h:47,v:.72,c:'#9fd18b'}, emi:{h:61,v:.57,c:'#e6b17a'},
  teacher:{c:'#c9c2b0'}, manager:{c:'#c9c2b0'}, past_natsuki:{c:'#d9b08c'}
};
const POSX_W = {l:20, lc:34, c:50, rc:66, r:80}, POSX_N = {l:27, lc:38, c:50, rc:62, r:73};
const POSX = new Proxy({}, {get:(_,k)=> (app.clientWidth/app.clientHeight<1.15?POSX_N:POSX_W)[k]});
const SCALE = .95/(69*.57); // Kōhei fills 95% of stage height
const CHAPTERS = [
  {k:'PROLOGUE', t:'The Dream', start:'prologue', th:'cg_hands_strap'},
  {k:'CHAPTER 1', t:'The House Next Door', start:'c1_morning', th:'cg_natsuki_intro'},
  {k:'CHAPTER 2', t:'Kendo', start:'c2_tuesday', th:'cg_jigeiko'},
  {k:'CHAPTER 3', t:'Windows', start:'c3_shift', th:'cg_window_night'},
];
const KANJI = ['','第一話','第二話','第三話','第四話'];
const store = {
  get(k,d){try{const v=localStorage.getItem('ozk.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('ozk.'+k,JSON.stringify(v))}catch(e){}}
};
const prefs = Object.assign({text:62, auto:45, bgm:62, voice:90, sfx:70, mute:{}}, store.get('prefs',{}));

/* ---------- dom ---------- */
const $ = s=>document.querySelector(s);
const app=$('#app'), box=$('#box'), nameEl=$('#name'), textEl=$('#text');
const bgImgs=[...document.querySelectorAll('#bg .bgimg')], cgImgs=[...document.querySelectorAll('#cg .bgimg')];
let bgFront=0, cgFront=0;

/* ---------- audio (Web Audio so volume works on iPad) ---------- */
let ac=null, gBgm, gVoice, gSfx, bgmWanted=null, silentEl=null;
const bufCache=new Map();
/* decoded audio is large (a 2-minute stereo track is ~50 MB as PCM), so keep only recent music and voice in memory */
function cachePut(key, p){ bufCache.delete(key); bufCache.set(key, p);
  const lim = key.startsWith('v:') ? 60 : key.includes('/bgm/') ? 3 : 1e9, pre = key.startsWith('v:') ? 'v:' : key.includes('/bgm/') ? 'audio/bgm/' : null;
  if(!pre) return; const keys=[...bufCache.keys()].filter(k=>k.startsWith(pre));
  for(let k=0;k<keys.length-lim;k++) if(keys[k]!==key && !(bgmWanted && keys[k].endsWith('/'+bgmWanted+'.mp3'))) bufCache.delete(keys[k]); }
const diag={errors:[], decodeOk:0, decodeFail:0, unlocked:false};
function note(kind, e){ const m=kind+': '+((e&&(e.name?e.name+' ':'')+(e.message||''))||String(e)); diag.errors.push(m); if(diag.errors.length>40) diag.errors.shift(); }
/* decodeAudioData has both a callback and a promise form; WebKit rejects the promise even when callbacks are given, so handle both */
function decode(ab){ return new Promise(res=>{ let done=false;
  const ok=b=>{ if(done) return; done=true; diag.decodeOk++; res(b); }, bad=e=>{ if(done) return; done=true; diag.decodeFail++; note('decode',e); res(null); };
  try{ const p=ac.decodeAudioData(ab, ok, bad); if(p&&p.then) p.then(ok,bad); }catch(e){ bad(e); } }); }
function silentWavURL(){ const sr=22050, n=sr/2, bytes=n*2, buf=new ArrayBuffer(44+bytes), v=new DataView(buf), w=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+bytes,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,bytes,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'})); }
/* iPhone/iPad Silent Mode mutes Web Audio unless the page's audio session is "playback":
   use the Audio Session API where available, and a silent looping media element as the fallback */
function unlockIOS(){
  try{ if(navigator.audioSession && navigator.audioSession.type!=='playback') navigator.audioSession.type='playback'; }catch(e){ note('audioSession',e); }
  try{ if(!silentEl){ silentEl=document.createElement('audio'); silentEl.setAttribute('playsinline',''); silentEl.setAttribute('x-webkit-airplay','deny'); silentEl.loop=true; silentEl.preload='auto'; silentEl.src=silentWavURL(); }
    const p=silentEl.play(); if(p&&p.then) p.then(()=>{diag.unlocked=true;},e=>note('unlock',e)); }catch(e){ note('unlock',e); }
}
function resumeAudio(){ if(ac && ac.state!=='running'){ try{ const p=ac.resume(); if(p&&p.catch) p.catch(e=>note('resume',e)); }catch(e){ note('resume',e); } } }
function audioInit(){
  unlockIOS();
  if(ac){ resumeAudio(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC){ note('init','Web Audio not available'); return; }
  try{
    ac=new AC(); gBgm=ac.createGain(); gVoice=ac.createGain(); gSfx=ac.createGain();
    [gBgm,gVoice,gSfx].forEach(g=>g.connect(ac.destination)); applyVol();
    const b=ac.createBuffer(1,1,ac.sampleRate), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0);
    resumeAudio();
    if(bgmWanted){ const w=bgmWanted; bgmName=null; playBgm(w); }
  }catch(e){ note('init',e); }
}
function applyVol(){ if(!ac) return; gBgm.gain.cancelScheduledValues(ac.currentTime); gBgm.gain.value=(prefs.bgm/100)**1.6*(vNode?0.55:1); gVoice.gain.value=(prefs.voice/100)**1.3; gSfx.gain.value=(prefs.sfx/100)**1.5; }
async function loadBuf(url){
  if(bufCache.has(url)){ const p=bufCache.get(url); cachePut(url,p); return p; }
  const p=fetch(url).then(r=>{ if(!r.ok) throw new Error(url+' '+r.status); return r.arrayBuffer(); }).then(decode).catch(e=>{ note('load',e); bufCache.delete(url); return null; });
  cachePut(url,p); return p;
}
let bgmName=null, bgmGain=null, bgmTok=0, bgmSrcs=[], bgmTimer=null;
/* music loops by crossfading the end of the track into a fresh start, so long scenes never hear a hard seam */
function bgmIter(buf, g, when, first, tok){
  const XF=Math.min(2.5, buf.duration/8), s=ac.createBufferSource(), sg=ac.createGain(); s.buffer=buf; s.connect(sg); sg.connect(g);
  if(first) sg.gain.setValueAtTime(1, when); else { sg.gain.setValueAtTime(0, when); sg.gain.linearRampToValueAtTime(1, when+XF); }
  const end=when+buf.duration; sg.gain.setValueAtTime(1, end-XF); sg.gain.linearRampToValueAtTime(0, end);
  s.start(when); s.stop(end+0.05); bgmSrcs.push(s); s.onended=()=>{ bgmSrcs=bgmSrcs.filter(x=>x!==s); };
  const next=end-XF;
  bgmTimer=setTimeout(()=>{ if(tok===bgmTok) bgmIter(buf,g,next,false,tok); }, Math.max(0,(next-ac.currentTime-4)*1000));
}
async function playBgm(name){
  bgmWanted=name;
  if(!ac) return;
  if(name===bgmName) return; bgmName=name;
  const tok=++bgmTok; clearTimeout(bgmTimer);
  const oldG=bgmGain, oldSrcs=bgmSrcs; bgmGain=null; bgmSrcs=[];
  if(oldG){ const t=ac.currentTime; oldG.gain.cancelScheduledValues(t); oldG.gain.setValueAtTime(oldG.gain.value,t); oldG.gain.linearRampToValueAtTime(0,t+1.4); setTimeout(()=>{ oldSrcs.forEach(x=>{try{x.stop()}catch(e){}}); try{oldG.disconnect()}catch(e){} },1600); }
  if(!name) return;
  const buf=await loadBuf(`audio/bgm/${name}.mp3`); if(!buf||tok!==bgmTok) return;
  const g=ac.createGain(); g.connect(gBgm); const t=ac.currentTime+0.05; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+1.6);
  bgmGain=g; bgmIter(buf, g, t, true, tok);
}
/* voice packs: voice/index.json -> {id:[pack,offset,length]} */
let vIndex=null, vPacks=new Map(), vNode=null, vNodeOnEnd=null;
fetch('voice/index.json').then(r=>r.ok?r.json():null).then(j=>{vIndex=j}).catch(()=>{});
async function voiceBuf(id){
  if(!vIndex||!vIndex[id]||!ac) return null;
  const [pack,off,len]=vIndex[id]; const key='v:'+id;
  if(bufCache.has(key)){ const p=bufCache.get(key); cachePut(key,p); return p; }
  const p=(async()=>{
    if(vPacks.size>6 && !vPacks.has(pack)) vPacks.delete(vPacks.keys().next().value);
    if(!vPacks.has(pack)) vPacks.set(pack, fetch('voice/'+pack).then(r=>{ if(!r.ok) throw new Error('voice/'+pack+' '+r.status); return r.arrayBuffer(); }).catch(e=>{ vPacks.delete(pack); throw e; }));
    const ab=await vPacks.get(pack); const slice=ab.slice(off,off+len);
    return await decode(slice);
  })().catch(e=>{ note('voice',e); bufCache.delete(key); return null; });
  cachePut(key,p); return p;
}
let vTok=0, jaText=null;
fetch('voice/ja.json').then(r=>r.ok?r.json():null).then(j=>{jaText=j}).catch(()=>{});
function duck(on){ if(!ac) return; const t=ac.currentTime, g=gBgm.gain, base=(prefs.bgm/100)**1.6; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(on?base*0.55:base, t+(on?0.15:0.6)); }
function stopVoice(){ vTok++; if(vNode){ vNode.onended=null; try{vNode.stop()}catch(e){} vNode=null; duck(false); } }
async function playVoice(id, who, onEnd){
  stopVoice(); const tok=vTok; if(prefs.mute[who]) return false;
  const buf=await voiceBuf(id); if(!buf||tok!==vTok) return false;   // the player moved on while it loaded
  const s=ac.createBufferSource(); s.buffer=buf; s.connect(gVoice);
  s.onended=()=>{ if(vNode===s){ vNode=null; duck(false); onEnd&&onEnd(); } }; s.start(); vNode=s; duck(true); return true;
}
async function playSfx(name){ if(!ac) return; const b=await loadBuf(`audio/sfx/${name}.mp3`); if(!b) return; const s=ac.createBufferSource(); s.buffer=b; s.connect(gSfx); s.start(); }

/* ---------- state ---------- */
let S=null, SP={}, SPK={}; const preloaded=new Set();
const state={i:0,bg:'black',cg:null,spr:{},bgm:null,mode:'normal',ilabel:'',read:{}};
let busy=false, typing=false, typeTimer=null, fullText='', autoOn=false, skipOn=false, waitTimer=null, autoTimer=null, curLine=null, running=false;
const log=[];

function sprImg(who){
  let el=document.querySelector(`.spr[data-who="${who}"]`);
  if(!el){ el=document.createElement('img'); el.className='spr'; el.dataset.who=who; el.alt=''; $('#sprites').appendChild(el); }
  return el;
}
function stageH(){ const w=app.clientWidth,h=app.clientHeight; return Math.min(h, w*0.92); }
function layoutSprites(){
  const H=stageH();
  document.querySelectorAll('.spr').forEach(el=>{
    const c=CHAR[el.dataset.who]||{h:64,v:.57}; el.style.height=Math.round(H*SCALE*c.h*c.v)+'px';
  });
}
setBg.tok=0; setCg.tok=0;
function setBg(name, tr){
  state.bg=name;
  if(name==='black'||name==='white'){ setBg.tok++; $('#bgSolid').style.background=name==='white'?'#fff':'#000'; bgImgs.forEach(i=>i.classList.remove('on')); return; }
  const next=bgImgs[1-bgFront], cur=bgImgs[bgFront];
  const dur = tr==='cut'?0: tr==='slow'?1.8: .9;
  next.style.transition=`opacity ${dur}s ease`; cur.style.transition=`opacity ${dur}s ease`;
  const tok=++setBg.tok; next.onload=()=>{ if(tok!==setBg.tok) return; next.classList.add('on'); cur.classList.remove('on'); };
  next.src=`img/bg/${name}.webp`; if(next.complete&&next.naturalWidth) next.onload();
  bgFront=1-bgFront;
  if(tr==='flash') flash();
}
function setCg(name, tr){
  state.cg=name;
  if(!name){ setCg.tok++; cgImgs.forEach(i=>i.classList.remove('on')); return; }
  const next=cgImgs[1-cgFront], cur=cgImgs[cgFront], dur=tr==='cut'?0:tr==='slow'?1.8:1;
  next.style.transition=`opacity ${dur}s ease`; cur.style.transition=`opacity ${dur}s ease`;
  const tok=++setCg.tok; next.onload=()=>{ if(tok!==setCg.tok) return; next.classList.add('on'); cur.classList.remove('on'); };
  next.src=`img/bg/${name}.webp`; if(next.complete&&next.naturalWidth) next.onload(); cgFront=1-cgFront;
}
function showSpr(who, spr, pos){
  const el=sprImg(who); const prev=state.spr[who];
  pos = pos || (prev&&prev.pos) || 'c';
  state.spr[who]={spr,pos};
  const c=CHAR[who]||{h:64,v:.57}; el.style.height=Math.round(stageH()*SCALE*c.h*c.v)+'px';
  el.style.left=POSX[pos]+'%';
  const url=`img/ch/${spr}.webp`;
  if(!el.src.endsWith(url)){ const pre=new Image(); pre.onload=()=>{el.src=url; el.classList.add('on');}; pre.src=url; }
  else el.classList.add('on');
}
function hideSpr(who){ delete state.spr[who]; const el=document.querySelector(`.spr[data-who="${who}"]`); if(el) el.classList.remove('on'); }
function hideAll(){ Object.keys(state.spr).forEach(hideSpr); }
function dimFor(speaker){ document.querySelectorAll('.spr').forEach(el=>el.classList.toggle('dim', !!speaker && speaker!=='kohei' && el.dataset.who!==speaker && Object.keys(state.spr).includes(speaker))); }
function flash(){ const f=$('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
function shake(){ app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake'); }
function setMode(m,label){ state.mode=m; state.ilabel=label||''; $('#tint').classList.toggle('on',m==='interlude'); const il=$('#ilabel'); il.textContent=label?`— ${label} —`:''; il.classList.toggle('on',m==='interlude'); textEl.classList.toggle('interlude',m==='interlude'); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1600); }

/* ---------- phone ---------- */
function phoneMsg(who,text){ const p=$('#phone'); p.classList.add('on'); const m=document.createElement('div'); m.className='msg '+(who==='me'?'me':'them'); m.textContent=text; p.appendChild(m);
  while(p.scrollHeight>p.clientHeight && p.children.length>2) p.children[1].remove(); }
function phoneClear(){ const p=$('#phone'); p.classList.remove('on'); setTimeout(()=>{ if(!p.classList.contains('on')) [...p.querySelectorAll('.msg')].forEach(m=>m.remove()); },400); }

/* ---------- text ---------- */
function cps(){ return prefs.text>=100?1e9: 18+prefs.text*1.1; }
function typeOut(t, cls){
  fullText=t; textEl.className=cls+(state.mode==='interlude'?' interlude':''); textEl.textContent='';
  if(skipOn||cps()>1e8){ textEl.textContent=t; typing=false; addCur(); return; }
  typing=true; let n=0; const step=Math.max(1,Math.round(cps()/60));
  clearInterval(typeTimer); typeTimer=setInterval(()=>{ n+=step; textEl.textContent=t.slice(0,n); if(n>=t.length){ clearInterval(typeTimer); typing=false; addCur(); scheduleAuto(); } },1000/60);
}
function addCur(){ const c=document.createElement('span'); c.className='cur'; c.textContent='▾'; textEl.appendChild(c); }
function finishType(){ clearInterval(typeTimer); typing=false; textEl.textContent=fullText; addCur(); scheduleAuto(); }

/* ---------- runner ---------- */
function scheduleAuto(){
  clearTimeout(autoTimer); if(!autoOn||skipOn) return;
  const base=900+fullText.length*28*(1.6-prefs.auto/100);
  const go=()=>{ if(autoOn&&!typing&&!overlayOpen()) advance(); };
  if(vNode){ vNodeOnEnd=()=>{ autoTimer=setTimeout(go,500+ (100-prefs.auto)*12); }; }
  else autoTimer=setTimeout(go, base);
}
function overlayOpen(){ return !!document.querySelector('.panel.on') || !$('#title').hidden; }

function run(){
  if(running) return; running=true;
  try{
    while(state.i<S.length){
      const c=S[state.i++];
      if(c.t!=='phone' && c.t!=='say' && c.t!=='nar') {/* fallthrough */}
      switch(c.t){
        case 'scene': state.scene=c.id; store.set('cont',snap()); break;
        case 'bg': phoneClear(); if(state.cg) setCg(null, c.tr==='cut'?'cut':'fade'); setBg(c.name,c.tr); hideAll(); if(c.tr==='slow'||c.tr==='flash') return pause(skipOn?80:1100); if(c.name==='black'||c.name==='white') return pause(skipOn?60:600); break;
        case 'cg': setCg(c.name,c.tr); if(c.name) { box.classList.add('hidden'); return pause(skipOn?60:1100,true); } break;
        case 'bgm': playBgm(c.name); state.bgm=c.name; break;
        case 'sfx': if(!skipOn) playSfx(c.name); break;
        case 'show': showSpr(c.who,c.spr,c.pos); break;
        case 'hide': hideSpr(c.who); break;
        case 'hideall': hideAll(); break;
        case 'mode': setMode(c.mode,c.label); break;
        case 'flash': if(!skipOn) flash(); break;
        case 'shake': if(!skipOn) shake(); break;
        case 'wait': return pause(skipOn?40:c.s*1000);
        case 'card': return dateCard(c.text);
        case 'chapter': return chapterCard(c);
        case 'endchapter': return pause(200);
        case 'endpilot': store.set('cont',null); return endPilot();
        case 'video': break; // future cutscenes: falls back to continuing
        case 'phone': if(!skipOn) playSfx('notif'); curLine=c; box.classList.add('hidden'); phoneMsg(c.who,c.text); nameEl.textContent=''; textEl.textContent=''; log.push({who:c.who==='me'?'Natsuki (text)':'Chie (text)',t:c.text}); devUpdate(); return waitTap(0);
        case 'say': case 'nar': return line(c);

function snap(){ // state at current command index (rewind to the line being shown)

  const phone = $('#phone').classList.contains('on') ? [...document.querySelectorAll('#phone .msg')].map(m=>({who:m.classList.contains('me')?'me':'them', text:m.textContent})) : [];
  if(curLine && curLine.t==='phone') phone.pop();
  return {i, bg:state.bg, cg:state.cg, spr:JSON.parse(JSON.stringify(state.spr)), bgm:state.bgm, mode:state.mode, ilabel:state.ilabel, t:Date.now(), scene:state.scene, phone};
}
function restore(s){
  cardFinish=null; stopVoice(); clearTimeout(waitTimer); clearTimeout(autoTimer); clearInterval(typeTimer); typing=false; curLine=null;
  ['#endCard','#chapterCard','#dateCard'].forEach(q=>$(q).classList.remove('on')); phoneClear(); document.querySelectorAll('#phone .msg').forEach(m=>m.remove());
  // characters who stay on stage keep their element (no flicker when stepping line by line); everyone else goes
  const keep=s.spr||{}; document.querySelectorAll('.spr').forEach(e=>{ if(!keep[e.dataset.who]) e.remove(); }); state.spr={};
  setBg(s.bg||'black','cut'); setCg(s.cg||null,'cut');

  (s.phone||[]).forEach(m=>phoneMsg(m.who,m.text));
  playBgm(s.bgm||null); state.bgm=s.bgm||null; setMode(s.mode||'normal',s.ilabel); state.scene=s.scene;

function startAt(idx){

  for(let k=0;k<idx;k++){ const c=S[k];
    if(c.t==='bg'){s.bg=c.name;s.spr={};s.cg=null;s.phone=[];} else if(c.t==='cg'){s.cg=c.name;} else if(c.t==='bgm'){s.bgm=c.name;}
