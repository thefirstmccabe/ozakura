<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Insert Presentation Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Test of how a portrait manga insert plays inside the landscape VN. Same look as the pilot (night ink + washi). */
:root{
  --ink:#10131f; --ink-2:#1b2034; --paper:#f3ecdf; --paper-dim:#bdb6a8; --sakura:#e8a7b5; --gilt:#c9a46a;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;font-family:var(--f-body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;touch-action:manipulation;cursor:pointer}

/* VN layer */
#vn{position:absolute;inset:0;transition:opacity .6s}
#vn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#box{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));
  width:min(1180px,calc(100% - 32px));min-height:clamp(96px,17vh,160px);box-sizing:border-box;
  background:linear-gradient(180deg,rgba(16,19,31,.80),rgba(16,19,31,.92));border-top:1px solid rgba(201,164,106,.55);
  border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.45);padding:clamp(18px,2.6vh,28px) clamp(18px,3vw,40px)}
#text{font-size:clamp(17px,2.55vh,27px);line-height:1.62;color:#ebe3d4}
.off{opacity:0;pointer-events:none}

/* insert layer */
#ins{position:absolute;inset:0;background:var(--ink);transition:opacity .6s}
.view{position:absolute;overflow:hidden}
.pg{position:absolute;left:0;top:0;width:1600px;height:2272px;transform-origin:0 0;will-change:transform;
  transition:transform .55s cubic-bezier(.4,.1,.2,1)}
.pg img{display:block;width:1600px;height:2272px}
.hl{position:absolute;box-shadow:0 0 0 4000px rgba(16,19,31,.86);transition:all .55s cubic-bezier(.4,.1,.2,1);pointer-events:none}
.hl.none{box-shadow:0 0 0 4000px rgba(16,19,31,0)}
.ring{position:absolute;outline:6px solid var(--sakura);outline-offset:2px;transition:all .4s ease;pointer-events:none}
.cover{position:absolute;background:#fbf8f2;transition:opacity .45s ease}
.cover.gone{opacity:0}

/* HUD */
#hud{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:5;cursor:default}
#modes{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;background:rgba(16,19,31,.82);border:1px solid rgba(201,164,106,.45);border-radius:6px;padding:4px}
#modes button{font:500 13px var(--f-body);color:var(--paper-dim);background:transparent;border:0;border-radius:4px;padding:7px 10px;cursor:pointer}
#modes button.on{background:var(--ink-2);color:var(--paper);box-shadow:inset 0 -2px 0 var(--sakura)}
#info{position:absolute;right:10px;bottom:10px;z-index:5;font:12px var(--f-body);color:var(--paper-dim);background:rgba(16,19,31,.72);border-radius:4px;padding:4px 8px;text-align:right;max-width:300px;pointer-events:none}
#hint{position:absolute;left:12px;bottom:10px;pointer-events:none;font:12px var(--f-body);color:var(--paper-dim);opacity:.8;z-index:5}
</style>
</head>
<body>
<div id="app">
  <div id="vn"><img src="../../img/bg/bg_dojo.webp" alt=""><div id="box"><div id="text"></div></div></div>
  <div id="ins" class="off"></div>
  <div id="hud">
    <div id="modes">
      <button data-m="guided">Panel by panel</button>
      <button data-m="split">Split</button>
      <button data-m="build">Build-up page</button>
      <button data-m="full">Full page</button>
    </div>
  </div>
  <div id="info"></div>
  <div id="hint">Tap or → to advance · ← back · test text is provisional</div>
</div>
<script>
const PAGES=[
 {src:'../cutscene-test/oct12b/pages/page1.jpg',panels:[[70,70,1530,590],[640,612,1530,1222],[70,612,618,1222],[1010,1244,1530,2202],[70,1244,988,2202]]},
 {src:'../cutscene-test/oct12b/pages/page2.jpg',panels:[[900,70,1530,700],[70,70,878,700],[70,722,1530,1532],[70,1554,1530,2202]]}
];
const PW=1600,PH=2272,BALLOON=38; // lettering size on the page master, for the readout
const BEFORE=['The captain stepped between us and raised his hand.','Across the floor, Natsuki settled into her stance. I couldn\'t see her face behind the helmet grille, but I knew she was smiling.'];
const AFTER=['One point each. My wrist still stung.','And I couldn\'t shake the feeling that she\'d known exactly where I was going to be.'];
const MODES={guided:'Panel by panel',split:'Split',build:'Build-up page',full:'Full page'};
let mode='guided',steps=[],i=0;
try{const m=localStorage.getItem('ozk-insert-mode'); if(MODES[m]) mode=m;}catch(e){}

const app=document.getElementById('app'),vn=document.getElementById('vn'),ins=document.getElementById('ins'),
      text=document.getElementById('text'),info=document.getElementById('info');

function build(){
  steps=[];
  BEFORE.forEach(t=>steps.push({vn:t}));
  PAGES.forEach((p,pi)=>{
    if(mode==='full'){steps.push({page:pi,panel:-1});return;}
    if(mode==='guided') steps.push({page:pi,panel:-1}); // establishing look at the whole page
    p.panels.forEach((_,k)=>steps.push({page:pi,panel:k}));
  });
  AFTER.forEach(t=>steps.push({vn:t}));
}

function fit(box,W,H,pad){ // scale + offset that fits a page-space box into a W x H view
  const [x0,y0,x1,y1]=box, bw=x1-x0, bh=y1-y0;
  const s=Math.min((W-2*pad)/bw,(H-2*pad)/bh);
  return {s,tx:W/2-(x0+bw/2)*s,ty:H/2-(y0+bh/2)*s};
}
function pageEl(src){
  const pg=document.createElement('div');pg.className='pg';
  const im=new Image();im.src=src;pg.appendChild(im);return pg;
}
let cur={page:-1,mode:null},els={};

function setupPage(pi){
  ins.innerHTML='';els={};
  const p=PAGES[pi];
  if(mode==='split'){
    els.main=document.createElement('div');els.main.className='view';
    els.side=document.createElement('div');els.side.className='view';
    els.mpg=pageEl(p.src);els.spg=pageEl(p.src);
    els.hl=document.createElement('div');els.hl.className='hl';els.mpg.appendChild(els.hl);
    els.ring=document.createElement('div');els.ring.className='ring';els.spg.appendChild(els.ring);
    els.main.appendChild(els.mpg);els.side.appendChild(els.spg);ins.append(els.main,els.side);
  }else{
    els.main=document.createElement('div');els.main.className='view';
    els.mpg=pageEl(p.src);els.main.appendChild(els.mpg);ins.appendChild(els.main);
    if(mode==='guided'){els.hl=document.createElement('div');els.hl.className='hl none';els.mpg.appendChild(els.hl);}
    if(mode==='build'){
      els.covers=p.panels.map(b=>{const c=document.createElement('div');c.className='cover';
        Object.assign(c.style,{left:b[0]+'px',top:b[1]+'px',width:(b[2]-b[0])+'px',height:(b[3]-b[1])+'px'});els.mpg.appendChild(c);return c;});
      els.ring=document.createElement('div');els.ring.className='ring';els.mpg.appendChild(els.ring);
    }
  }
  cur={page:pi,mode};
}
function place(el,W,H,L,T){Object.assign(el.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px'});}
function boxStyle(el,b,pad){Object.assign(el.style,{left:(b[0]-pad)+'px',top:(b[1]-pad)+'px',width:(b[2]-b[0]+2*pad)+'px',height:(b[3]-b[1]+2*pad)+'px'});}

function render(){
  const st=steps[i], W=app.clientWidth, H=app.clientHeight;
  if(st.vn!==undefined){
    vn.classList.remove('off');ins.classList.add('off');text.textContent=st.vn;
    info.textContent=MODES[mode]+' · VN scene';return;
  }
  vn.classList.add('off');ins.classList.remove('off');
  if(cur.page!==st.page||cur.mode!==mode) setupPage(st.page);
  const P=PAGES[st.page], whole=[0,0,PW,PH], b=st.panel>=0?P.panels[st.panel]:whole;
  let s;
  if(mode==='split'){
    const sideW=Math.round(Math.min(W*0.3,H*PW/PH));
    place(els.side,sideW,H,W-sideW,0);place(els.main,W-sideW,H,0,0);
    const f2=fit(whole,sideW,H,10);els.spg.style.transform=`translate(${f2.tx}px,${f2.ty}px) scale(${f2.s})`;
    boxStyle(els.ring,b,0);
    const f=fit(b,W-sideW,H,Math.min(W,H)*0.04);els.mpg.style.transform=`translate(${f.tx}px,${f.ty}px) scale(${f.s})`;
    boxStyle(els.hl,b,24);s=f.s;
  }else{
    place(els.main,W,H,0,0);
    const zoom=(mode==='guided'&&st.panel>=0);
    const f=fit(zoom?b:whole,W,H,zoom?Math.min(W,H)*0.04:8);
    els.mpg.style.transform=`translate(${f.tx}px,${f.ty}px) scale(${f.s})`;s=f.s;
    if(mode==='guided'){ if(zoom){els.hl.classList.remove('none');boxStyle(els.hl,b,24);} else {els.hl.classList.add('none');boxStyle(els.hl,whole,0);} }
    if(mode==='build'){els.covers.forEach((c,k)=>c.classList.toggle('gone',k<=st.panel));boxStyle(els.ring,b,0);}
  }
  const px=Math.round(BALLOON*s);
  info.textContent=`${MODES[mode]} · page ${st.page+1}${st.panel>=0?' · panel '+(st.panel+1):''} · dialogue ≈ ${px}px`+(px<14?' (too small to read)':'');
}
function go(d){i=Math.max(0,Math.min(steps.length-1,i+d));render();}
function setMode(m){mode=m;try{localStorage.setItem('ozk-insert-mode',m)}catch(e){}
  document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x.dataset.m===m));
  build();cur={page:-1,mode:null};i=BEFORE.length;render();}
document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();setMode(b.dataset.m);}));
document.getElementById('hud').addEventListener('click',e=>e.stopPropagation());
app.addEventListener('click',e=>{ if(e.clientX<app.clientWidth*0.18) go(-1); else if(i===steps.length-1){i=0;render();} else go(1); });
addEventListener('keydown',e=>{ if(['ArrowRight',' ','Enter'].includes(e.key)) go(1); else if(e.key==='ArrowLeft') go(-1); });
addEventListener('resize',()=>{cur={page:-1,mode:null};render();});
document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x.dataset.m===mode));
build();render();
</script>
</body>
</html>
